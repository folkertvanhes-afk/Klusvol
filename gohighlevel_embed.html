
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klusvol Hero Embed</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                orange: '#FF5722',
                dark: '#111827',
                darker: '#0B0F19',
              }
            },
            animation: {
              'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'pop-in': 'popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'scale-up': 'scaleUp 0.3s ease-out forwards',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'star-pop': 'starPop 0.3s ease-out forwards',
              'float': 'float 6s ease-in-out infinite',
              'fade-in-slow': 'fadeIn 1s ease-out forwards', /* Only for background glow */
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              popIn: { '0%': { transform: 'scale(0.8)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
              scaleUp: { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
              starPop: { '0%': { transform: 'scale(0.5)', opacity: '0' }, '80%': { transform: 'scale(1.2)' }, '100%': { transform: 'scale(1)', opacity: '1' } },
              float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-15px)' } },
            }
          },
        },
      }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-500 { animation-delay: 500ms; }
        .delay-700 { animation-delay: 700ms; }
    </style>
</head>
<body class="bg-transparent"> <!-- Transparent body for embedding -->

<div id="hero-app" class="relative w-full h-[700px] flex flex-col items-center justify-center font-sans">
    <!-- Glow (Keep fade here, it is safe) -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] md:w-[500px] md:h-[500px] bg-brand-orange/10 blur-[60px] md:blur-[100px] rounded-full pointer-events-none animate-fade-in-slow"></div>

    <!-- Phone Container -->
    <div id="phone-container" class="relative w-[280px] h-[560px] md:w-[300px] md:h-[600px] shrink-0 z-20 transition-transform duration-500 md:hover:scale-[1.02]">
        
        <!-- iPhone Frame -->
        <div class="absolute inset-0 bg-gray-900 rounded-[3rem] border-8 border-gray-800 shadow-2xl overflow-hidden ring-4 ring-brand-orange/30 z-10">
            <!-- Notch -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 h-7 w-28 md:w-32 bg-black rounded-b-2xl z-50 flex items-center justify-center gap-2">
                <div class="w-12 md:w-16 h-4 bg-black rounded-full flex items-center justify-end px-2">
                   <div class="w-1 h-1 rounded-full bg-gray-800"></div>
                </div>
            </div>
            
            <!-- Screen Content -->
            <div id="screen-content" class="h-full w-full rounded-[2.3rem] overflow-hidden bg-black text-white relative">
                <!-- Content injected via JS -->
            </div>

            <!-- Gloss -->
            <div class="absolute inset-0 rounded-[2.5rem] pointer-events-none bg-gradient-to-tr from-white/5 to-transparent z-40"></div>
        </div>

        <!-- Badges Desktop -->
        <div id="badges-desktop" class="hidden md:block absolute inset-0 pointer-events-none">
            <!-- Badges injected via JS -->
        </div>
    </div>

    <!-- Badges Mobile -->
    <div id="badges-mobile" class="md:hidden w-full max-w-[340px] mt-8 px-4 grid grid-cols-2 gap-3 opacity-0 animate-slide-up delay-700">
        <!-- Badges injected via JS -->
    </div>
</div>

<script>
    // --- SVG Icons (Inline strings) ---
    const icons = {
        userPlus: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>`,
        calendarCheck: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="m9 16 2 2 4-4"/></svg>`,
        star: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
        receipt: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17V7"/></svg>`,
        chevron: `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>`,
        whatsapp: `<svg viewBox="0 0 24 24" fill="currentColor" class="w-full h-full"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>`,
        google: `<svg viewBox="0 0 24 24" class="w-full h-full"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>`
    };

    // --- Data ---
    const badges = [
        { id: 'lead', category: 'Nieuwe Lead', label: 'Willem Jansen', icon: icons.userPlus, position: 'md:top-24 md:right-full md:mr-5' },
        { id: 'appointment', category: 'Eerstvolgende', label: '14:00 Dakinspectie', icon: icons.calendarCheck, position: 'md:top-36 md:left-full md:ml-5' },
        { id: 'review', category: 'Google Review', label: '★★★★★ 5.0', icon: icons.star, position: 'md:bottom-40 md:right-full md:mr-5' },
        { id: 'invoice', category: 'Factuur Betaald', label: '+ € 1.500,00', icon: icons.receipt, position: 'md:bottom-24 md:left-full md:ml-5' }
    ];

    let state = {
        activeScreen: 'default',
        isAutoPlaying: true,
        currentIndex: 0
    };

    // --- HTML Generators ---
    
    function getFormattedTime() {
        const now = new Date();
        return now.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    }

    // REMOVED 'animate-fade-in' class from the outer div below to fix black screen issue
    function getScreenWrapper(title, subtitle, content) {
        return `
            <div class="h-full w-full bg-gray-950 text-white flex flex-col font-sans overflow-hidden relative">
                <div class="h-12 w-full flex justify-between items-end px-6 pb-2 text-xs font-medium z-20 shrink-0">
                    <span class="tabular-nums clock-time">${getFormattedTime()}</span>
                    <div class="flex gap-1.5">
                        <div class="w-4 h-4 rounded-sm border border-white/30"></div>
                        <div class="w-4 h-4 rounded-sm border border-white/30"></div>
                        <div class="w-6 h-4 rounded-sm bg-white"></div>
                    </div>
                </div>
                <div class="flex-1 overflow-y-auto no-scrollbar relative z-10 pt-4 flex flex-col">
                    ${title ? `<div class="px-6 mb-4 animate-slide-up">
                        ${subtitle ? `<p class="text-brand-orange text-xs font-bold uppercase tracking-wide mb-0.5">${subtitle}</p>` : ''}
                        <h2 class="text-xl font-bold">${title}</h2>
                    </div>` : ''}
                    ${content}
                </div>
                 <div class="h-20 shrink-0 bg-gray-900 border-t border-gray-800 flex justify-around items-center px-2 pb-4 z-20">
                    <div class="bg-brand-orange/20 p-1.5 rounded-full text-brand-orange"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
                    <div class="opacity-50"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg></div>
                    <div class="bg-brand-orange rounded-full p-3 -mt-8 shadow-lg shadow-brand-orange/40 text-white"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></div>
                    <div class="opacity-50"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
                    <div class="opacity-50"><div class="w-6 h-6 rounded-full bg-gray-700"></div></div>
                </div>
                <div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/20 rounded-full z-30"></div>
            </div>
        `;
    }

    function renderDefault() {
        return getScreenWrapper('Mark de Jong', 'Goedemiddag', `
            <div class="px-6 space-y-4">
                 <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-900 p-4 rounded-2xl border border-gray-800 animate-pop-in delay-100 opacity-0">
                        <div class="text-gray-400 text-xs uppercase font-bold mb-1">Openstaand</div>
                        <div class="text-xl font-bold">€ 15.9K</div>
                    </div>
                    <div class="bg-gray-900 p-4 rounded-2xl border border-gray-800 animate-pop-in delay-200 opacity-0">
                        <div class="text-gray-400 text-xs uppercase font-bold mb-1">Afspraken</div>
                        <div class="text-xl font-bold text-brand-orange">4 vandaag</div>
                    </div>
                </div>
                <div class="mt-6 animate-slide-up delay-300 opacity-0">
                    <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">Vandaag</h3>
                    <div class="space-y-3">
                        <div class="flex items-center gap-3 bg-gray-900/50 p-3 rounded-xl border border-gray-800/50">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 bg-[#25D366]/10 text-[#25D366]"><div class="w-5 h-5">${icons.whatsapp}</div></div>
                            <div class="flex-1"><h4 class="font-semibold text-sm">Willem Jansen</h4><p class="text-xs text-gray-400">Nieuw bericht</p></div>
                        </div>
                         <div class="flex items-center gap-3 bg-gray-900/50 p-3 rounded-xl border border-gray-800/50">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 bg-white/10"><div class="w-5 h-5">${icons.google}</div></div>
                            <div class="flex-1"><h4 class="font-semibold text-sm">Anja de Vries</h4><p class="text-xs text-gray-400">5 sterren op Google</p></div>
                        </div>
                    </div>
                </div>
            </div>
        `);
    }

    function renderLead() {
        return getScreenWrapper('Nieuwe Lead', null, `
            <div class="px-5 pt-2">
                 <div class="flex items-center gap-3 bg-[#25D366]/20 p-3 rounded-full mb-6 animate-pop-in border border-[#25D366]/30">
                    <div class="w-8 h-8 rounded-full bg-[#25D366] flex items-center justify-center shrink-0 text-white"><div class="w-5 h-5">${icons.whatsapp}</div></div>
                    <span class="text-sm font-medium">1 nieuw bericht</span>
                 </div>
                 <div class="bg-gray-900 border border-brand-orange rounded-2xl p-5 shadow-lg animate-slide-up delay-100 opacity-0">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center text-xl font-bold text-brand-orange border border-gray-700">W</div>
                            <div><h3 class="font-bold text-lg">Willem Jansen</h3><p class="text-gray-400 text-sm">Badkamer renovatie</p></div>
                        </div>
                    </div>
                    <div class="p-3 bg-gray-950/50 rounded-lg border border-gray-800/50 mb-4"><p class="text-gray-400 text-xs italic">"Hi! Ik zoek een vakman voor het volledig renoveren..."</p></div>
                    <div class="grid grid-cols-2 gap-3">
                        <button class="py-2.5 bg-gray-800 rounded-lg text-sm font-medium text-gray-300">Bel</button>
                        <button class="py-2.5 bg-[#25D366] text-white rounded-lg text-sm font-medium">WhatsApp</button>
                    </div>
                 </div>
            </div>
        `);
    }

    function renderAppointment() {
        return getScreenWrapper('Agenda', null, `
            <div class="px-5 pt-2">
                 <div class="flex justify-between mb-6 pb-4 border-b border-gray-800 overflow-x-auto no-scrollbar animate-fade-in"> <!-- This one is small, keeping it is usually fine, but if issues persist remove this too -->
                    <div class="flex flex-col items-center min-w-[3rem] p-2 rounded-xl bg-brand-orange text-white scale-110 shadow-lg"><span class="text-xs">Ma</span><span class="text-lg font-bold">12</span></div>
                    <div class="flex flex-col items-center min-w-[3rem] p-2 rounded-xl text-gray-500"><span class="text-xs">Di</span><span class="text-lg font-bold">13</span></div>
                    <div class="flex flex-col items-center min-w-[3rem] p-2 rounded-xl text-gray-500"><span class="text-xs">Wo</span><span class="text-lg font-bold">14</span></div>
                    <div class="flex flex-col items-center min-w-[3rem] p-2 rounded-xl text-gray-500"><span class="text-xs">Do</span><span class="text-lg font-bold">15</span></div>
                 </div>
                 <div class="relative pl-4 border-l-2 border-brand-orange ml-2 animate-slide-up delay-200 opacity-0">
                    <div class="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-brand-orange border-4 border-gray-950 animate-pulse"></div>
                    <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 mb-4 shadow-lg">
                        <div class="flex justify-between items-start mb-2"><span class="text-brand-orange font-bold text-sm">14:00 - 15:30</span><span class="bg-blue-500/10 text-blue-400 text-[10px] px-2 py-0.5 rounded font-bold uppercase">Inspectie</span></div>
                        <h3 class="font-bold text-lg mb-1">Dakinspectie</h3>
                        <div class="flex items-center gap-2 text-gray-400 text-sm mb-3"><span>Kerkstraat 12, Groningen</span></div>
                    </div>
                 </div>
            </div>
        `);
    }

    function renderReview() {
        return getScreenWrapper('Reputatie', null, `
             <div class="px-5 pt-8 flex flex-col items-center text-center">
                 <div class="w-20 h-20 rounded-full bg-white flex items-center justify-center shadow-lg mb-4 animate-pop-in"><div class="w-10 h-10">${icons.google}</div></div>
                 <h3 class="text-2xl font-bold mb-1 animate-slide-up delay-100 opacity-0">Nieuwe Review!</h3>
                 <div class="bg-gray-900 w-full p-6 rounded-2xl border border-gray-800 mt-6 relative animate-scale-up delay-300 opacity-0">
                    <div class="flex justify-center text-yellow-400 gap-1 mb-2">★★★★★</div>
                    <p class="text-gray-300 italic mb-4">"Fantastisch werk geleverd door het team. Zeker een aanrader!"</p>
                    <div class="font-bold text-sm">Anja de Vries</div>
                 </div>
             </div>
        `);
    }

    function renderInvoice() {
        // Simple animation simulation for invoice status
        setTimeout(() => {
            const el = document.getElementById('inv-status');
            const icon = document.getElementById('inv-icon');
            if(el && icon) {
                el.innerHTML = 'Betaling Ontvangen';
                el.classList.add('text-green-400');
                icon.classList.remove('bg-gray-800');
                icon.classList.add('bg-green-500');
                icon.innerHTML = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white animate-scale-up"><polyline points="20 6 9 17 4 12"/></svg>`;
            }
        }, 1500);

        return getScreenWrapper('Financieel', null, `
            <div class="px-5 pt-10">
                <div class="border border-gray-800 bg-gray-900 rounded-2xl p-6 text-center mb-6 animate-pop-in">
                    <div id="inv-icon" class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 bg-gray-800 transition-all duration-500">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-600"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
                    </div>
                    <h3 id="inv-status" class="font-bold text-lg text-white transition-colors duration-300">Verwerken...</h3>
                    <p class="text-3xl font-bold text-white mt-2">€ 1.500,00</p>
                </div>
            </div>
        `);
    }

    // --- Core Logic ---

    function renderScreen(id) {
        const screen = document.getElementById('screen-content');
        switch(id) {
            case 'lead': screen.innerHTML = renderLead(); break;
            case 'appointment': screen.innerHTML = renderAppointment(); break;
            case 'review': screen.innerHTML = renderReview(); break;
            case 'invoice': screen.innerHTML = renderInvoice(); break;
            default: screen.innerHTML = renderDefault(); break;
        }
    }

    function renderBadges() {
        const desktopContainer = document.getElementById('badges-desktop');
        const mobileContainer = document.getElementById('badges-mobile');
        
        // Generate Desktop Badges
        desktopContainer.innerHTML = badges.map(b => {
            const isActive = state.activeScreen === b.id;
            const isLeft = b.position.includes('right-full');
            
            return `
            <div onclick="handleInteraction('${b.id}')" 
                 onmouseenter="handleInteraction('${b.id}', true)"
                 class="pointer-events-auto absolute z-30 transition-all duration-300 cursor-pointer ${b.position} ${!isActive ? 'animate-float' : ''} ${isLeft ? 'origin-right' : 'origin-left'} flex items-center">
                
                <div class="hidden md:block absolute top-1/2 w-6 h-[1px] -translate-y-1/2 transition-all duration-500 pointer-events-none ${isLeft ? '-right-6' : '-left-6'} ${isActive ? 'bg-brand-orange opacity-100' : 'bg-gray-700 opacity-30'}"></div>
                
                <div class="flex items-center gap-3 py-2 px-3 min-w-[160px] rounded-xl border backdrop-blur-md shadow-lg transition-all duration-300 ${isLeft ? 'flex-row-reverse text-right' : 'text-left'} ${isActive ? 'bg-gray-800/95 border-brand-orange scale-105' : 'bg-gray-900/40 border-gray-700/50 hover:bg-gray-800/80 hover:scale-105'}">
                    <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0 transition-colors duration-300 ${isActive ? 'bg-brand-orange text-white' : 'bg-gray-800 text-gray-400'}">${b.icon}</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-[9px] font-bold uppercase tracking-wide mb-0 ${isActive ? 'text-brand-orange' : 'text-gray-500'}">${b.category}</p>
                        <h3 class="font-semibold text-white text-sm leading-tight truncate">${b.label}</h3>
                    </div>
                </div>
            </div>`;
        }).join('');

        // Generate Mobile Badges
        mobileContainer.innerHTML = badges.map(b => {
             const isActive = state.activeScreen === b.id;
             return `
             <div onclick="handleInteraction('${b.id}')" class="flex flex-col items-center justify-center gap-2 p-3 rounded-xl border backdrop-blur-md shadow-lg transition-all duration-300 ${isActive ? 'bg-gray-800 border-brand-orange' : 'bg-gray-900/40 border-gray-700/50'}">
                <div class="w-10 h-10 rounded-lg flex items-center justify-center ${isActive ? 'bg-brand-orange text-white' : 'bg-gray-800 text-gray-400'}">${b.icon}</div>
                <div class="text-center">
                    <h3 class="font-medium text-white text-xs truncate w-full">${b.label}</h3>
                </div>
             </div>`;
        }).join('');
    }

    // --- Event Handlers ---

    window.handleInteraction = (id, isHover = false) => {
        state.activeScreen = id;
        state.currentIndex = badges.findIndex(b => b.id === id);
        if (isHover) state.isAutoPlaying = false;
        updateUI();
    };

    function updateUI() {
        renderScreen(state.activeScreen);
        renderBadges();
    }

    // --- Init & Loop ---

    document.getElementById('phone-container').addEventListener('mouseleave', () => {
        state.isAutoPlaying = true;
        state.activeScreen = 'default';
        updateUI();
    });

    // Auto-pilot
    setInterval(() => {
        if (state.isAutoPlaying && window.innerWidth >= 768) {
            state.currentIndex = (state.currentIndex + 1) % badges.length;
            state.activeScreen = badges[state.currentIndex].id;
            updateUI();
        }
    }, 3000);

    // Clock updater
    setInterval(() => {
        const els = document.querySelectorAll('.clock-time');
        els.forEach(el => el.innerText = getFormattedTime());
    }, 1000);

    // Initial Render
    updateUI();

</script>
</body>
</html>
